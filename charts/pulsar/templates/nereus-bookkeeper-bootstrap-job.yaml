{{- if and .Values.nereus.enabled .Values.nereus.bootstrap.enabled .Values.nereus.bookkeeperWal.enabled }}
{{- $bootstrapIdentity := printf "%s\n%s" (include (print $.Template.BasePath "/nereus-admin-configmap.yaml") .) (toJson .Values.nereus) }}
{{- $bootstrapRevision := $bootstrapIdentity | sha256sum | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ template "pulsar.fullname" . }}-nereus-bk-bootstrap-{{ $bootstrapRevision }}"
  namespace: {{ template "pulsar.namespace" . }}
  labels:
    {{- include "pulsar.standardLabels" . | nindent 4 }}
    component: nereus-bk-bootstrap
    benchmark.nereusstream.com/bootstrap-revision: {{ $bootstrapRevision | quote }}
spec:
  activeDeadlineSeconds: {{ .Values.nereus.bootstrap.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.nereus.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.nereus.bootstrap.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nereus.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nereus.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-oxia
          image: "{{ .Values.nereus.admin.image.repository }}:{{ .Values.nereus.admin.image.tag }}"
          imagePullPolicy: {{ .Values.nereus.admin.image.pullPolicy }}
          command:
            - sh
            - -ec
          args:
            - |
              deadline=$(($(date +%s) + {{ .Values.nereus.brokerWait.timeoutSeconds }}))
              until getent hosts {{ template "pulsar.oxia.server.service" . }} >/dev/null 2>&1; do
                test "$(date +%s)" -lt "$deadline"
                sleep 2
              done
      containers:
        - name: bootstrap
          image: "{{ .Values.nereus.admin.image.repository }}:{{ .Values.nereus.admin.image.tag }}"
          imagePullPolicy: {{ .Values.nereus.admin.image.pullPolicy }}
          command:
            - /opt/nereus-admin/bin/nereus-admin
          args:
            - bookkeeper
            - namespace
            - ensure
            - --config
            - /etc/nereus-admin/admin.properties
            - --timeout-seconds
            - "{{ .Values.nereus.admin.timeoutSeconds }}"
            - --output
            - /dev/termination-log
          resources:
            {{- toYaml .Values.nereus.admin.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nereus-admin
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: "{{ template "pulsar.fullname" . }}-nereus-admin"
{{- end }}
